<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#75c7df" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LifeOS" />
  <link rel="manifest" href="lifeos.webmanifest" />
  <link rel="apple-touch-icon" href="lifeos_icon.png" />
  <link rel="icon" type="image/png" href="lifeos_icon.png" />
  <title>LifeOS</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      color: #1f2937;
      background:
        radial-gradient(circle at 18% 78%, rgba(140, 207, 114, 0.22), transparent 28%),
        radial-gradient(circle at 80% 18%, rgba(117, 199, 223, 0.18), transparent 30%),
        linear-gradient(180deg, #ffffff 0%, #f5fbff 100%);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app-bg {
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: clamp(22px, 5vw, 52px);
      overflow: hidden;
    }
    .welcome-phone {
      position: relative;
      width: min(100%, 450px);
      min-height: auto;
      overflow: visible;
      border: 0;
      border-radius: 0;
      background: none !important;
      box-shadow: none !important;
      padding: 0;
    }
    .welcome-content {
      display: flex;
      height: calc(100vh - clamp(44px, 10vw, 104px));
      height: calc(100dvh - clamp(44px, 10vw, 104px));
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .logo-mark {
      position: relative;
      width: clamp(92px, 24vw, 126px);
      height: clamp(92px, 24vw, 126px);
      overflow: hidden;
      border-radius: 0;
      background: url("lifeos_icon.png") center / contain no-repeat;
      mix-blend-mode: multiply;
    }
    .logo-mark::before,
    .logo-mark::after {
      display: none;
    }
    .brand {
      margin: 8px 0 0;
      font-size: clamp(42px, 11vw, 60px);
      font-weight: 400;
      letter-spacing: -0.055em;
      line-height: 1;
    }
    .brand span { color: #78c86a; }
    .brand strong { color: #63bde3; font-weight: 500; }
    h1 {
      margin: clamp(18px, 3.6vh, 30px) 0 0;
      color: #111827;
      font-size: clamp(21px, 5.3vw, 28px);
      font-weight: 700;
      letter-spacing: -0.035em;
    }
    .subcopy {
      margin: 5px 0 0;
      color: #6b7280;
      font-size: clamp(12px, 3.2vw, 15px);
      font-weight: 500;
    }
    .character-wrap {
      position: relative;
      width: min(78vw, 320px);
      height: min(78vw, 320px);
      margin-top: clamp(24px, 5vh, 44px);
      overflow: hidden;
      border-radius: 999px;
      clip-path: circle(49.5% at 50% 50%);
      background: #ffffff;
    }
    .character-wrap::before {
      display: none;
    }
    .character {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      border-radius: 999px;
      filter: none;
    }
    .welcome-actions {
      display: grid;
      width: 100%;
      gap: 12px;
      margin-top: clamp(22px, 4vh, 34px);
      max-width: 390px;
    }
    .welcome-actions button {
      min-height: 58px;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease, box-shadow 180ms ease;
    }
    .get-started {
      background: #7bc86c;
      color: #ffffff;
      box-shadow: 0 10px 20px rgba(123, 200, 108, 0.22);
    }
    .login {
      background: #cceefd;
      color: #111827;
    }
    .welcome-actions button:active {
      transform: translateY(1px) scale(0.99);
    }
    .welcome-actions button:hover {
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.16);
      filter: saturate(1.02);
    }
    @media (min-width: 760px) {
      .app-bg {
        padding: 56px 24px;
        place-items: center;
      }
      .welcome-phone {
        width: min(100%, 520px);
        min-height: auto;
        border-radius: 0;
        padding: 0;
        background: none !important;
        box-shadow: none !important;
      }
      .welcome-content {
        min-height: calc(100vh - 112px);
        min-height: calc(100dvh - 112px);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .character-wrap {
        width: min(48vw, 360px);
        height: min(48vw, 360px);
        margin-top: 34px;
        justify-self: center;
      }
      .logo-mark,
      .brand,
      h1,
      .subcopy,
      .welcome-actions {
        justify-self: center;
      }
      .logo-mark {
        width: 124px;
        height: 124px;
      }
      .brand {
        margin-top: 8px;
        font-size: 62px;
      }
      h1 {
        margin-top: 28px;
        font-size: 30px;
      }
      .subcopy {
        margin-top: 7px;
        font-size: 16px;
      }
      .welcome-actions {
        width: 100%;
        max-width: 410px;
        margin-top: 32px;
      }
      .welcome-actions button {
        min-height: 60px;
        font-size: 16px;
      }
    }
    @media (min-width: 760px) and (max-width: 960px) {
      .welcome-phone {
        width: min(100%, 460px);
        min-height: auto;
        padding: 0;
      }
      .character-wrap {
        width: min(64vw, 340px);
        height: min(64vw, 340px);
      }
    }
    @media (max-width: 520px) {
      .app-bg { padding: 20px 20px; }
      .welcome-phone {
        width: 100%;
        min-height: auto;
      }
      .welcome-content {
        min-height: calc(100vh - 40px);
        min-height: calc(100dvh - 40px);
        justify-content: flex-start;
      }
      .logo-mark {
        width: 154px;
        height: 154px;
      }
      .brand {
        margin-top: 2px;
        font-size: 68px;
      }
      h1 {
        margin-top: 20px;
        font-size: 24px;
      }
      .subcopy {
        margin-top: 4px;
        font-size: 15px;
      }
      .character-wrap {
        width: min(78vw, 286px);
        height: min(78vw, 286px);
        margin-top: 52px;
      }
      .welcome-actions {
        gap: 10px;
        margin-top: 20px;
        max-width: 360px;
      }
      .welcome-actions button {
        min-height: 52px;
        font-size: 14px;
      }
    }
    @media (max-width: 380px) {
      .app-bg { padding: 18px 18px; }
      .welcome-phone {
        width: 100%;
        min-height: auto;
        border-radius: 0;
        padding: 0;
      }
      .welcome-content {
        min-height: calc(100vh - 36px);
        min-height: calc(100dvh - 36px);
        justify-content: flex-start;
      }
      .logo-mark { width: 138px; height: 138px; }
      .brand { font-size: 61px; }
      h1 { margin-top: 18px; font-size: 22px; }
      .subcopy { font-size: 14px; }
      .character-wrap {
        width: min(80vw, 276px);
        height: min(80vw, 276px);
        margin-top: 48px;
      }
      .welcome-actions {
        margin-top: 18px;
        max-width: 340px;
      }
      .welcome-actions button { min-height: 50px; }
    }
    @media (max-height: 720px) and (max-width: 520px) {
      .app-bg { padding-top: 16px; padding-bottom: 16px; }
      .welcome-content {
        min-height: calc(100vh - 32px);
        min-height: calc(100dvh - 32px);
        justify-content: flex-start;
      }
      .logo-mark { width: 128px; height: 128px; }
      .brand { margin-top: 2px; font-size: 57px; }
      h1 { margin-top: 15px; font-size: 20px; }
      .subcopy { font-size: 13px; }
      .character-wrap {
        width: min(76vw, 260px);
        height: min(76vw, 260px);
        margin-top: 44px;
      }
      .welcome-actions {
        gap: 10px;
        margin-top: 18px;
        max-width: 340px;
      }
      .welcome-actions button {
        min-height: 48px;
        font-size: 13px;
      }
    }
    @media (max-width: 760px), (max-height: 820px) {
      .app-bg {
        padding: clamp(10px, 2.7vmin, 24px);
      }
      .welcome-content {
        height: calc(100dvh - (clamp(10px, 2.7vmin, 24px) * 2));
        min-height: 0;
        justify-content: center;
      }
      .logo-mark {
        width: clamp(72px, min(31vw, 17dvh), 154px);
        height: clamp(72px, min(31vw, 17dvh), 154px);
      }
      .brand {
        margin-top: clamp(0px, 0.6dvh, 6px);
        font-size: clamp(34px, min(14vw, 7.2dvh), 68px);
      }
      h1 {
        margin-top: clamp(8px, 2dvh, 20px);
        font-size: clamp(16px, min(5.2vw, 3dvh), 24px);
      }
      .subcopy {
        margin-top: clamp(2px, 0.7dvh, 5px);
        font-size: clamp(10px, min(3.4vw, 1.9dvh), 15px);
      }
      .character-wrap {
        width: clamp(150px, min(76vw, 34dvh), 286px);
        height: clamp(150px, min(76vw, 34dvh), 286px);
        margin-top: clamp(12px, 5.4dvh, 52px);
      }
      .welcome-actions {
        width: min(100%, 350px);
        gap: clamp(7px, 1.3dvh, 10px);
        margin-top: clamp(10px, 2.2dvh, 20px);
      }
      .welcome-actions button {
        min-height: clamp(40px, 6.3dvh, 52px);
        font-size: clamp(12px, 3vw, 14px);
      }
    }
    @media (max-height: 600px) {
      .logo-mark {
        width: clamp(58px, 14dvh, 92px);
        height: clamp(58px, 14dvh, 92px);
      }
      .brand {
        font-size: clamp(30px, 6.5dvh, 44px);
      }
      h1 {
        margin-top: clamp(6px, 1.3dvh, 10px);
      }
      .character-wrap {
        width: clamp(128px, 30dvh, 190px);
        height: clamp(128px, 30dvh, 190px);
        margin-top: clamp(8px, 3dvh, 18px);
      }
      .welcome-actions {
        margin-top: clamp(8px, 2dvh, 14px);
      }
      .welcome-actions button {
        min-height: clamp(36px, 6.2dvh, 44px);
      }
    }
  </style>
</head>
<body data-auth-page="landing">
  <main class="app-bg">
    <section class="welcome-phone" aria-labelledby="welcomeTitle">
      <div class="welcome-content">
        <span class="logo-mark" aria-hidden="true"></span>
        <p class="brand"><span>Life</span><strong>OS</strong></p>
        <h1 id="welcomeTitle">Welcome back!</h1>
        <p class="subcopy">Let's make today productive.</p>
        <div class="character-wrap" aria-hidden="true">
          <img class="character" src="lifi_welcome.png" alt="" />
        </div>
        <div class="welcome-actions">
          <button type="button" class="get-started" id="landingGetStarted">Get Started</button>
          <button type="button" class="login" id="landingLogin">Login</button>
        </div>
      </div>
    </section>
  </main>
  <script src="auth.js?v=20260721-2"></script>
  <script>
    document.getElementById("landingGetStarted").addEventListener("click", () => window.lifeOSOpenAuth?.("signup"));
    document.getElementById("landingLogin").addEventListener("click", () => window.lifeOSOpenAuth?.("signin"));
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
